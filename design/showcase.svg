    <p id="tab-status">Best audio Netflix sent: <strong>Dolby Atmos</strong></p>
    <p id="tab-video">Video: <strong>2160p · HEVC Dolby Vision · 10.4 Mb/s</strong></p>
    <p id="tab-range" class="note">Netflix offers 342p to 2160p</p>
