<svg xmlns="http://www.w3.org/2000/svg" width="940" height="726" viewBox="0 0 940 726" role="img" aria-label="Surroundflix app window and toolbar popup">
<style>
.sf-frame { display: flex; gap: 28px; align-items: flex-start; justify-content: center;
  padding: 8px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  --frame-line: #c9c5bd; --frame-muted: #59636e; --bar: #e6e3dd; --bar-text: #4a4d53;
  --pop-bg: #f4f2ee; }
@media (prefers-color-scheme: dark) { .sf-frame { --frame-line: #3d424a; --frame-muted: #9198a1;
  --bar: #2a2d32; --bar-text: #c9c7c2; --pop-bg: #1b1d21; } }
.sf-frame figure { margin: 0; }
.sf-frame figcaption { color: var(--frame-muted); text-align: center; margin-top: 10px; }
/* A macOS window: title bar with the three window buttons. */
.sf-window { border: 1px solid var(--frame-line); border-radius: 10px; overflow: hidden; }
.sf-bar { position: relative; height: 28px; background: var(--bar); color: var(--bar-text);
  border-bottom: 1px solid var(--frame-line); font-weight: 600; font-size: 13px;
  display: flex; align-items: center; justify-content: center; }
.sf-lights { position: absolute; left: 10px; top: 8px; display: flex; gap: 8px; }
.sf-lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.sf-lights i:nth-child(1) { background: #ff5f57; } .sf-lights i:nth-child(2) { background: #febc2e; }
.sf-lights i:nth-child(3) { background: #28c840; }
/* Safari's popover: rounded panel with an arrow pointing at the toolbar button. */
.sf-pop { position: relative; margin-top: 9px; border: 1px solid var(--frame-line);
  border-radius: 10px; }
.sf-pop .sf-popup { border-radius: 10px; overflow: hidden; }
.sf-arrow { position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
  background: var(--pop-bg); border-left: 1px solid var(--frame-line);
  border-top: 1px solid var(--frame-line); transform: rotate(45deg); }
.sf-app { width: 584px; } .sf-popup { width: 300px; }

.sf-app {
  --bg: #f4f2ee; --panel: #fbfaf7; --text: #23252a; --muted: #5d6169;
  --line: #dcd8d0; --accent: #985a15; --accent-ink: #ffffff; --ok: #3d7a4a;
  accent-color: var(--accent);
  caret-color: var(--accent);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { .sf-app {
    --bg: #1b1d21; --panel: #23262b; --text: #e8e6e1; --muted: #a3a7ae;
    --line: #353940; --accent: #de9a40; --accent-ink: #1b1d21; --ok: #7cc28a;
  } }
.sf-app * { box-sizing: border-box; }
.sf-app, .sf-app { margin: 0; background: var(--bg); color: var(--text); }
.sf-app {
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  -webkit-user-select: none; user-select: none; cursor: default;
}
.sf-app p, .sf-app li { -webkit-user-select: text; user-select: text; }
.sf-app ::selection { background: var(--accent); color: var(--accent-ink); }
.sf-app a { color: var(--accent); }
.sf-app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sf-app .window { max-width: 520px; margin: 0 auto; padding: 28px 32px 22px; }
.sf-app header { display: flex; gap: 16px; align-items: center; margin-bottom: 22px; }
.sf-app h1 { margin: 0; font-size: 22px; font-weight: 600; }
.sf-app .version { color: var(--muted); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
.sf-app .status {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 12px 14px;
}
.sf-app .status strong { font-weight: 600; }
.sf-app .dot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  margin-right: 8px; vertical-align: 1px; background: var(--muted);
}
.sf-app .status.on .dot { background: var(--ok); }
.sf-app .status.off .dot { background: var(--accent); }
.sf-app button {
  font: inherit; border-radius: 4px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.sf-app button.plain, .sf-app .status.on button { background: transparent; color: var(--text); border-color: var(--line); }
.sf-app button:hover { filter: brightness(1.08); }
.sf-app button:disabled { opacity: .6; cursor: default; }
.sf-app select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.sf-app h2 {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; margin: 24px 0 10px;
}
.sf-app section p { margin: 0 0 6px; }
.sf-app ol { margin: 0; padding-left: 20px; }
.sf-app ol li { margin-bottom: 6px; }
.sf-app .note { color: var(--muted); font-size: 12.5px; }
.sf-app footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.sf-app footer .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sf-app footer .row + .row { margin-top: 10px; }
.sf-app .lang { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.sf-popup {
  --bg: #f4f2ee; --text: #23252a; --muted: #5d6169; --line: #dcd8d0; --accent: #985a15;
  accent-color: var(--accent);
  caret-color: var(--accent);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { .sf-popup { --bg: #1b1d21; --text: #e8e6e1; --muted: #a3a7ae; --line: #353940; --accent: #de9a40; } }
.sf-popup * { box-sizing: border-box; }
.sf-popup {
  margin: 0; width: 300px; background: var(--bg); color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
}
.sf-popup main { padding: 14px 16px; max-height: 500px; overflow-y: auto; }
.sf-popup header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 15px; }
.sf-popup header .version {
  margin-left: auto; color: var(--muted); white-space: nowrap;
  font-size: 12px; font-family: ui-monospace, Menlo, monospace;
}
.sf-popup fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0; padding: 8px 12px 10px; }
.sf-popup legend {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; padding: 0 4px;
}
.sf-popup label { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; cursor: pointer; }
.sf-popup fieldset:disabled label { cursor: default; opacity: .55; }
.sf-popup .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.sf-popup fieldset + fieldset, .sf-popup .warn + fieldset { margin-top: 10px; }
.sf-popup fieldset .note { margin: 6px 0 0; }
.sf-popup label.select { display: block; cursor: default; padding-top: 2px; }
.sf-popup select {
  display: block; width: 100%; margin-top: 4px;
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px;
}
.sf-popup .tab #tab-range { margin-top: 2px; }
.sf-popup .tab #tab-miss { margin-top: 6px; }
.sf-popup .warn { color: var(--text); border-left: 2px solid var(--accent); padding-left: 8px; }
.sf-popup .tab { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.sf-popup .tab h2 {
  margin: 0 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.sf-popup .tab p { margin: 0; }
.sf-popup .tab strong { color: var(--accent); font-weight: 600; }
.sf-popup ::selection { background: var(--accent); color: var(--bg); }
.sf-popup :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sf-popup fieldset .note + label.select { margin-top: 8px; }
.sf-popup .tab .debug { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.sf-popup .tab .debug[hidden] { display: none; }
.sf-popup .tab .debug .note { margin: 0; }
.sf-popup button {
  font: inherit; font-size: 12px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer;
}
.sf-popup button:hover { border-color: var(--muted); }
.sf-popup button.apply { display: block; margin-top: 6px; }
.sf-popup button[hidden] { display: none; }
.sf-popup { margin: 0; } .sf-popup main { max-height: none; overflow: visible; } .sf-app .window { margin: 0 auto; }</style>
<foreignObject x="0" y="0" width="940" height="726"><div xmlns="http://www.w3.org/1999/xhtml"><div class="sf-frame"><figure><div class="sf-window"><div class="sf-bar"><span class="sf-lights"><i></i><i></i><i></i></span>Surroundflix</div><div class="sf-app"><main class="window">
  <header>
