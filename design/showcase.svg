    <span><span class="dot" aria-hidden="true"></span><strong id="status-text" data-i18n="status_on" aria-live="polite">Surroundflix is on in Safari</strong></span>
    <button type="button" id="open-settings" data-i18n="open_settings">Open Safari Settings</button>
  </div>

  <section>
    <h2 data-i18n="setup">Setup</h2>
    <p id="all-set" data-i18n="all_set">All set. Play a title with 5.1 or Atmos sound on Netflix and pick that track in the audio menu.</p>
  </section>

  <section>
    <h2 data-i18n="audio_video">Audio and video</h2>
    <p data-i18n="audio_where">Choose between 5.1 and Atmos, 5.1 only or Netflix's default sound with the Surroundflix button in Safari's toolbar.</p>
    <p class="note" data-i18n="atmos_note">Atmos titles play as 5.1 in Safari. Control Center shows “Multichannel”, with Spatial Audio and head tracking.</p>
    <p data-i18n="app_video_where">The same button sets the video quality (automatic, a minimum resolution, always the best, or data saver) and the preferred codec.</p>
  </section>

  <footer>
    <div class="row">
      <a id="repo-link" href="https://github.com/AnzouK/surroundflix">GitHub</a>
      <label class="lang"><span data-i18n="language">Language</span>
        <select id="language"><option>Automatic</option></select>
      </label>
    </div>
    <div class="row">
      <span class="note" id="update-result" aria-live="polite"></span>
      <button type="button" class="plain" id="check-updates" data-i18n="updates_check">Check for updates</button>
    </div>
  </footer>
</main></div></div><figcaption>App window</figcaption></figure><figure><div class="sf-pop"><i class="sf-arrow"></i><div class="sf-popup"><main>
  <header>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="28" height="28" aria-hidden="true">
  
  <rect x="81.9" y="81.9" width="860.2" height="860.2" rx="194.6" fill="#1F2228"/>
  <circle cx="512.0" cy="579.6" r="65.5" fill="none" stroke="#6E7480" stroke-width="22.5"/>
  <circle cx="512.0" cy="272.4" r="63.5" fill="#DE9A40"/>
  <circle cx="306.4" cy="351.3" r="56.3" fill="#DE9A40"/>
