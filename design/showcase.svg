  <circle cx="790.4" cy="709.4" r="56.3" fill="#DE9A40"/>
</svg>
    <strong>Surroundflix</strong>
    <span class="version">1.3.0</span>
  </header>
  <fieldset id="presets">
    <legend data-i18n="audio">Audio</legend>
    <label><input type="radio" name="preset" value="atmos" checked="checked"/> <span data-i18n="preset_atmos">5.1 and Atmos (recommended)</span></label>
    <label><input type="radio" name="preset" value="surround"/> <span data-i18n="preset_surround">5.1 only, if Atmos titles fail to play</span></label>
    <label><input type="radio" name="preset" value="netflix"/> <span data-i18n="preset_netflix">Netflix default, for troubleshooting</span></label>
    <p class="note" id="preset-desc" aria-live="polite" data-i18n="pdesc_atmos">Asks Netflix for Dolby Atmos and 5.1. In Safari, Atmos plays as its 5.1 bed, with Spatial Audio on AirPods.</p>
  </fieldset>
  <fieldset id="video">
    <legend data-i18n="video">Video</legend>
    <label class="select"><span data-i18n="video_quality">Quality</span>
      <select id="video-quality" aria-describedby="video-quality-desc">
        <option value="auto" selected="selected" data-i18n="video_auto">Automatic (Netflix decides)</option>
        <option value="min720" data-i18n="video_min720">At least 720p</option>
        <option value="min1080" data-i18n="video_min1080">At least 1080p</option>
        <option value="min2160" data-i18n="video_min2160">At least 4K (2160p)</option>
        <option value="best" data-i18n="video_best">Always the best</option>
        <option value="saver720" data-i18n="video_saver">Data saver (720p max)</option>
      </select>
    </label>
    <p class="note" id="video-quality-desc" aria-live="polite" data-i18n="qdesc_auto">Netflix adapts the quality to your connection, as without Surroundflix.</p>
    <label class="select"><span data-i18n="video_codec">Codec</span>
      <select id="video-codec" aria-describedby="video-codec-desc">
        <option value="auto" selected="selected" data-i18n="codec_auto">Automatic (Netflix decides)</option>
        <option value="h264" data-i18n="codec_h264">H.264 (Netflix picks the profile)</option>
        <option value="h264main" data-i18n="codec_h264main">H.264 Main profile</option>
        <option value="h264high" data-i18n="codec_h264high">H.264 High profile</option>
        <option value="hevc" data-i18n="codec_hevc" data-browser="safari">HEVC (H.265), with HDR and Dolby Vision</option>
        <option value="av1" data-i18n="codec_av1">AV1</option>
      </select>
    </label>
    <p class="note" id="video-codec-desc" aria-live="polite" data-i18n="cdesc_auto">Netflix picks: usually AV1 in Chrome and HEVC in Safari.</p>
  </fieldset>
  <p class="note" data-i18n="apply_hint">Takes effect the next time you start a title.</p>
  <section class="tab">
