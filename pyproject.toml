[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surroundflix"
dynamic = ["version"]
description = "Netflix's Dolby 5.1 and Atmos audio in Safari on macOS, with Spatial Audio on AirPods, plus video quality and codec choice."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "AnzouK" }]
keywords = ["netflix", "safari", "chrome", "dolby", "atmos", "spatial-audio", "macos", "userscript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AnzouK/surroundflix"
Changelog = "https://github.com/AnzouK/surroundflix/blob/main/CHANGELOG.md"
Issues = "https://github.com/AnzouK/surroundflix/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "pyyaml>=6", "ruff==0.17.3"]

[project.scripts]
surroundflix = "surroundflix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surroundflix = ["templates/*", "templates/app/*", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.dynamic]
version = { attr = "surroundflix.__version__" }
