[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surroundflix"
version = "0.1.0"
description = "Ask Netflix for its 5.1 / Atmos audio tracks in Safari on macOS (Spatial Audio friendly)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AnzouK" }]
keywords = ["netflix", "safari", "dolby", "atmos", "spatial-audio", "macos", "userscript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
surroundflix = "surroundflix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surroundflix = ["templates/*", "templates/app/*", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
