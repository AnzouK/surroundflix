# Dependabot version updates. Alerts and security updates are switched on in
# the repository's Security settings; this file adds weekly bump PRs.
version: 2
updates:
  # The GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Python dev tools (pytest, ruff...) declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
