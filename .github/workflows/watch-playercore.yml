# Daily check that Netflix's player still knows the profile names
# Surroundflix asks for. Opens one issue when a name disappears; a fetch
# that fails (Netflix often answers 403 to CI runners) only fails the job.
#
# If the playercore URL can't be found, set the repository variable
# PLAYERCORE_URL to one copied from the browser's Network tab.

name: Watch Netflix playercore

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: watch-playercore
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Check playercore
        id: check
        env:
          PLAYERCORE_URL: ${{ vars.PLAYERCORE_URL }}
        run: |
          set +e
          args=(--json)
          if [ -n "$PLAYERCORE_URL" ]; then args+=(--url "$PLAYERCORE_URL"); fi
          surroundflix check "${args[@]}" > report.json
          status=$?
          # Only a report listing what's missing counts as a failure; a crash
          # with no report means nothing was checked.
          if [ "$status" = 1 ] && ! grep -q '"missing"' report.json; then status=2; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat report.json

      - name: Report a missing profile
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Netflix's player no longer lists a profile Surroundflix uses"
          {
            echo "The daily check found a profile name missing from Netflix's player."
            echo
            echo '```json'
            cat report.json
            echo '```'
          } > body.md
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

      - name: Fail when the check couldn't run
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::The playercore couldn't be found or fetched; nothing was checked."
          exit 1
