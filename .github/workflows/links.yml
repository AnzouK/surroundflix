# Weekly check of external links in the Markdown files (403/429 count as
# up, since many sites block bots). Internal links are in tests/test_docs.py.

name: Links

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude '^https://img\.shields\.io/'
            --exclude '^https://github\.com/AnzouK/surroundflix'
            './**/*.md'
          fail: true
