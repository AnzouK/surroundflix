# Lint, tests and build on every push to main and every pull request;
# release.yml also calls it before publishing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (node --check, ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Build dist/
        run: |
          pip install -e .
          surroundflix build
      - name: Syntax check (node --check)
        run: |
          find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: ESLint
        run: |
          npm install --no-save --no-package-lock --silent eslint@9 globals@15
          npx eslint dist --max-warnings 0

  python:
    name: Python ${{ matrix.python }} (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The tests run the generated JavaScript under Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint and format (ruff.toml)
        if: matrix.python == '3.12'
        run: |
          ruff check src tests scripts --output-format=github
          ruff format --check src tests scripts
      - name: Run pytest
        run: |
          pytest -q --tb=short --cov=surroundflix --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Build
        if: matrix.python == '3.12'
        run: surroundflix build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.python == '3.12'
        with:
          name: surroundflix-dist
          path: dist/
