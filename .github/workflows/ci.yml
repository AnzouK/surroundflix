# =====================================================================
# Surroundflix CI
# =====================================================================
# Runs on every push to main and every pull request, and before every
# release (release.yml calls it).
#
#   javascript  builds dist/, node --check on every built script, ESLint
#               (eslint.config.mjs: bug, hygiene and security rules, all
#               blocking)
#   python      compile, ruff (lint + format, ruff.toml with the bandit
#               rules) and pytest with coverage, 80% minimum, on the
#               oldest and newest supported Python
#
# Security scans (Bandit, pip-audit, gitleaks, CodeQL) are in security.yml.
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the code.
permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (node --check, ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build dist/
        run: |
          pip install -e .
          surroundflix build
      - name: Syntax check (node --check)
        run: |
          find dist -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: ESLint
        run: |
          npm install --no-save --no-package-lock --silent eslint@9 globals@15
          npx eslint dist --max-warnings 0

  python:
    name: Python ${{ matrix.python }} (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The tests run the generated JavaScript under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile every .py to catch SyntaxError
        run: python -m compileall -q src tests scripts
      - name: Ruff lint and format (ruff.toml)
        if: matrix.python == '3.12'
        run: |
          ruff check src tests scripts --output-format=github
          ruff format --check src tests scripts
      - name: Run pytest
        run: |
          pytest -q --tb=short --cov=surroundflix --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Build
        if: matrix.python == '3.12'
        run: surroundflix build
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: surroundflix-dist
          path: dist/
