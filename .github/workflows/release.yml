# On a version tag (scripts/release.py tag): runs the CI on the tagged
# commit, checks it is on main and matches the code's version, builds the
# .dmg, the userscript and the Chrome zip, and publishes the release with
# SHA256SUMS.txt, build provenance and the CHANGELOG section as notes.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Tag matches the code version
        run: |
          version=$(python -c "import surroundflix; print(surroundflix.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          surroundflix dmg --output release/Surroundflix.dmg
          cp build/dist/userscript/surroundflix.user.js release/
          (cd build/dist && zip -qr ../../release/surroundflix-chrome.zip chrome-extension)
          (cd release && shasum -a 256 Surroundflix.dmg surroundflix.user.js surroundflix-chrome.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Release notes from the CHANGELOG
        run: python3 scripts/release.py notes "$VERSION" > notes.md

      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release/Surroundflix.dmg
            release/surroundflix.user.js
            release/surroundflix-chrome.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Surroundflix.dmg release/surroundflix.user.js \
            release/surroundflix-chrome.zip release/SHA256SUMS.txt \
            --title "Surroundflix $VERSION" --notes-file notes.md --verify-tag
