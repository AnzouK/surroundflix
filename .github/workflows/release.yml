# Push a tag like v0.1.0 to build the .dmg on a macOS runner and attach it,
# together with the userscript, to a GitHub release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: surroundflix dmg --output release/Surroundflix.dmg
      - run: cp build/dist/userscript/surroundflix.user.js release/

      - uses: actions/upload-artifact@v4
        with:
          name: surroundflix-release
          path: release/

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Surroundflix.dmg release/surroundflix.user.js \
            --title "Surroundflix $GITHUB_REF_NAME" --generate-notes
