# =====================================================================
# Surroundflix security scans
# =====================================================================
# On every push to main, every pull request, and every Monday (new
# advisories appear even when the code doesn't change).
#
#   bandit     static analysis of the Python code (pyproject: [tool.bandit])
#   pip-audit  known vulnerabilities in the installed dependencies
#   gitleaks   secrets anywhere in the git history
#   codeql     GitHub's analysis of the Python and JavaScript code. Free on
#              public repositories only, so it's skipped while the repo is
#              private.
#
# The security tests themselves (tests/test_security.py) run in ci.yml.
# =====================================================================
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "bandit[toml]==1.9.4"
      - run: bandit -c pyproject.toml -r src

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Surroundflix itself isn't on PyPI, so it's skipped; everything it
      # installs (the dev tools) is audited.
      - name: Audit the dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
          pip-audit --skip-editable

  gitleaks:
    name: gitleaks (secrets in history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
