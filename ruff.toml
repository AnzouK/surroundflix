line-length = 100
target-version = "py39"

[lint]
# S = flake8-bandit security rules.
select = ["E", "W", "F", "B", "UP", "SIM", "I", "C90", "S"]
ignore = ["E501", "SIM105", "SIM108"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
# subprocess with fixed arguments and no shell (Apple's tools, git).
"src/surroundflix/build.py" = ["S603", "S607"]
"src/surroundflix/package.py" = ["S603", "S607"]
"scripts/release.py" = ["S603", "S607"]

[lint.isort]
known-first-party = ["surroundflix"]
