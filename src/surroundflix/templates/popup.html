<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surroundflix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <img src="images/icon-96.png" width="28" height="28" alt="">
    <strong>Surroundflix</strong>
  </header>
  <fieldset id="presets">
    <legend data-i18n="audio">Audio</legend>
    <label><input type="radio" name="preset" value="atmos"> <span data-i18n="preset_atmos"></span></label>
    <label><input type="radio" name="preset" value="surround"> <span data-i18n="preset_surround"></span></label>
    <label><input type="radio" name="preset" value="netflix"> <span data-i18n="preset_netflix"></span></label>
    <p class="note" id="preset-desc" aria-live="polite" data-i18n="pdesc_atmos"></p>
  </fieldset>
  <p class="note warn" id="no-dolby" hidden data-i18n="no_dolby"></p>
  <fieldset id="video">
    <legend data-i18n="video">Video</legend>
    <label class="select"><span data-i18n="video_quality"></span>
      <select id="video-quality" aria-describedby="video-quality-desc">
        <option value="auto" data-i18n="video_auto"></option>
        <option value="min720" data-i18n="video_min720"></option>
        <option value="min1080" data-i18n="video_min1080"></option>
        <option value="min2160" data-i18n="video_min2160"></option>
        <option value="best" data-i18n="video_best"></option>
        <option value="saver720" data-i18n="video_saver"></option>
      </select>
    </label>
    <p class="note" id="video-quality-desc" aria-live="polite" data-i18n="qdesc_auto"></p>
    <label class="select"><span data-i18n="video_codec"></span>
      <select id="video-codec" aria-describedby="video-codec-desc">
        <option value="auto" data-i18n="codec_auto"></option>
        <option value="h264" data-i18n="codec_h264"></option>
        <option value="h264main" data-i18n="codec_h264main"></option>
        <option value="h264high" data-i18n="codec_h264high"></option>
        <option value="hevc" data-i18n="codec_hevc" data-browser="safari"></option>
        <option value="av1" data-i18n="codec_av1"></option>
        <option value="vp9" data-i18n="codec_vp9" data-browser="chrome"></option>
      </select>
    </label>
    <p class="note" id="video-codec-desc" aria-live="polite" data-i18n="cdesc_auto"></p>
  </fieldset>
  <p class="note" data-i18n="apply_hint"></p>
  <button type="button" id="apply-now" class="apply" hidden data-i18n="apply_now"></button>
  <section class="tab">
    <h2 data-i18n="tab_heading"></h2>
    <p id="tab-status" aria-live="polite"></p>
    <p id="tab-video" hidden></p>
    <p id="tab-range" class="note" hidden></p>
    <p class="debug" id="debug" hidden>
      <button type="button" id="copy-debug" data-i18n="debug_copy"></button>
      <span class="note" id="debug-result" aria-live="polite"></span>
    </p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
